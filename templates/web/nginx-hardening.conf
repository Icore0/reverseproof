# Never serve sourcemaps or source control, even if they leak into the web root.
location ~* \.(map)$            { return 404; }
location ~ /\.(git|env|svn)     { return 404; }
# Make scraping/automation cost something (tune per route, enforce server-side too).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
location /api/ { limit_req zone=api burst=20 nodelay; }
